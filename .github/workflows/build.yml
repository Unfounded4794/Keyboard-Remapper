name: Build desktop applications
on: [workflow_dispatch, push, pull_request]
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            executable: win-unpacked/Keystone.exe
          - os: macos-15-intel
            platform: mac
            arch: x64
            executable: mac/Keystone.app/Contents/MacOS/Keystone
          - os: macos-latest
            platform: mac
            arch: arm64
            executable: mac-arm64/Keystone.app/Contents/MacOS/Keystone
          - os: ubuntu-latest
            platform: linux
            arch: x64
            executable: linux-unpacked/keystone-remapper
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            executable: linux-arm64-unpacked/keystone-remapper
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Build installers without publishing
        run: npm run dist -- --${{ matrix.platform }} --${{ matrix.arch }} --config.directories.output=release/${{ matrix.platform }}-${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Check packaged app launch
        if: runner.os != 'Linux'
        run: npm run test:packaged -- "release/${{ matrix.platform }}-${{ matrix.arch }}/${{ matrix.executable }}" "${{ matrix.arch }}"
      - name: Check packaged app launch on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:packaged -- "release/${{ matrix.platform }}-${{ matrix.arch }}/${{ matrix.executable }}" "${{ matrix.arch }}"
      - name: Write SHA-256 checksums
        run: node scripts/write-checksums.mjs release/${{ matrix.platform }}-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: keystone-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            release/${{ matrix.platform }}-${{ matrix.arch }}/*.exe
            release/${{ matrix.platform }}-${{ matrix.arch }}/*.dmg
            release/${{ matrix.platform }}-${{ matrix.arch }}/*.zip
            release/${{ matrix.platform }}-${{ matrix.arch }}/*.AppImage
            release/${{ matrix.platform }}-${{ matrix.arch }}/*.deb
            release/${{ matrix.platform }}-${{ matrix.arch }}/SHA256SUMS.txt
